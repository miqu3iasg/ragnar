[project]
name = "ragnar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cachetools>=7.1.8",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "openai>=3.1.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=6.0.0",
    "tavily-python>=0.8.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/__init__.py",
    "app/*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pyright]
include = ["app"]
extraPaths = ["app"]
